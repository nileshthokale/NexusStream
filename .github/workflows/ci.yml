name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Start backend and verify endpoints
        working-directory: backend
        run: |
          node server.js &
          sleep 3
          # Proxy responds (upstream may vary, just check the endpoint exists)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000/proxy?url=https%3A%2F%2Fexample.com%2F")
          echo "proxy status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "403" ] && [ "$STATUS" != "502" ]; then
            echo "Unexpected proxy status"; exit 1
          fi
          # Bad URL → 400
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5000/proxy?url=notaurl")
          if [ "$STATUS" != "400" ]; then
            echo "Proxy should reject invalid URLs with 400, got $STATUS"; exit 1
          fi
          echo "Backend checks passed"

      - name: Verify transcode endpoint reports missing ffmpeg cleanly
        working-directory: backend
        run: |
          curl -s -o /dev/null -w "transcode-no-ffmpeg:%{http_code}\n" "http://localhost:5000/transcode?url=https%3A%2F%2Fexample.com%2Fvideo.mkv" || true
