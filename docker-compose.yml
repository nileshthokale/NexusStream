services:
  backend:
    build: ./backend
    environment:
      - PORT=5000
      # Optional: override ffmpeg binary path
      # - FFMPEG_PATH=/usr/bin/ffmpeg
    restart: unless-stopped
    # Persist transcode sessions across restarts (optional)
    volumes:
      - transcode_cache:/tmp/nexustranscode

  frontend:
    build:
      context: ./frontend
      # Point the frontend at the backend container in production:
      args:
        VITE_PROXY_URL: ${VITE_PROXY_URL:-http://localhost:5000}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  transcode_cache:
